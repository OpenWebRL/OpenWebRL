### Example only.
### run_sft_with_llamafactory.sh generates a concrete YAML with real paths.

### model
model_name_or_path: Qwen/Qwen3-VL-4B-Thinking
image_max_pixels: 12845056
video_max_pixels: 12845056
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
dataset_dir: outputs/sft/llamafactory/data
media_dir: outputs/sft/llamafactory/data
dataset: openwebrl_sft_trajectories
template: qwen3_vl
cutoff_len: 36864
preprocessing_num_workers: 16
dataloader_num_workers: 4
mask_history: true

### output
output_dir: outputs/sft/llamafactory/checkpoints/qwen3-vl-openwebrl-sft
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none
run_name: qwen3-vl-openwebrl-sft

### train
num_train_epochs: 3.0
learning_rate: 1.0e-5
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
